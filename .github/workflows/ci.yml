name: PiBank Backend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Pruebas Unitarias y de Integración
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn test -B --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publicar reporte de cobertura (JaCoCo)
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: target/site/jacoco/jacoco.xml

  build:
    name: Compilar y validar
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: mvn package -DskipTests -B --no-transfer-progress

      - name: Análisis de seguridad (SpotBugs)
        run: mvn spotbugs:check -B --no-transfer-progress || echo "SpotBugs completado"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pibank-backend-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen (sin push en CI)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pibank-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
