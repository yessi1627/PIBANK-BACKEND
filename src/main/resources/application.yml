spring:
  application:
    name: pibank-backend

  profiles:
    active: dev

  # ===================== BASE DE DATOS =====================
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:pibank}
    password: ${DB_PASSWORD:PiBank2026!}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PiBankHikariPool

  # ===================== JPA / HIBERNATE =====================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ===================== FLYWAY (MIGRACIONES) =====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ===================== JACKSON (JSON) =====================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: America/Bogota

  # ===================== EMAIL =====================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@pibank.co}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ===================== SERVIDOR =====================
server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ===================== SEGURIDAD JWT =====================
pibank:
  security:
    jwt:
      secret: ${JWT_SECRET:PiBankSuperSecretKeyForJWT2026MustBeAtLeast256BitsLong!@#$%}
      access-token-expiration: 900000       # 15 minutos en ms
      refresh-token-expiration: 604800000   # 7 días en ms
    max-failed-login-attempts: 5
    account-lock-duration-minutes: 30
    rate-limit:
      requests-per-minute: 60
      requests-per-minute-auth: 10

  encryption:
    aes-key: ${AES_KEY:PiBankAES256KeyForSensitiveData!@#}

  atm:
    code-length: 6
    expiration-minutes: 15

  virtual-card:
    cvv-rotation-minutes: 5

  fraud:
    suspicious-amount-threshold: 5000000   # 5 millones COP
    suspicious-location-enabled: true

# ===================== ACTUATOR / MONITOREO =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ===================== DOCUMENTACIÓN API =====================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  info:
    title: PiBank API
    description: API REST del Banco Virtual PiBank — Documentación completa de todos los endpoints
    version: 1.0.0
    contact:
      name: Equipo PiBank
      email: dev@pibank.co

# ===================== LOGS =====================
logging:
  level:
    root: INFO
    com.pibank: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/pibank-backend.log
